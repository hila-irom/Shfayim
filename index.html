<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שאטלים שפיים</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="שאטל שפיים">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1B2266">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2266;--bg:#F4F5FA;--card:#fff;--ink:#14172E;--mut:#5C6080;--line:#E3E5EF;--go:#0F6E56;--soft:#E1F5EE}
@media(prefers-color-scheme:dark){:root{--bg:#0E1024;--card:#1A1D38;--ink:#EEF0FA;--mut:#A3A7C4;--line:#2C3054;--soft:#123B33}}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Assistant,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 18px 14px}
header h1{margin:0;font-size:22px;font-weight:700}
header p{margin:2px 0 0;font-size:14px;opacity:.85}
nav{display:flex;gap:8px;padding:12px 16px 0;max-width:560px;margin:auto}
nav button{flex:1;font:inherit;font-size:16px;font-weight:600;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
main{max-width:560px;margin:auto;padding:12px 16px calc(env(safe-area-inset-bottom) + 28px)}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.lbl{font-size:14px;color:var(--mut);margin:0}
.big{font-size:26px;font-weight:700;line-height:1.15;margin:4px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}.chip{font:inherit;font-size:15px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}.chip.star{border-color:var(--go);color:var(--go);font-weight:600}.chip .x{margin-inline-start:6px;color:#C0392B;font-weight:700}
.pill{display:inline-block;font-size:14px;font-weight:600;padding:3px 10px;border-radius:999px;color:#fff;margin:0 0 0 6px}
.meta{color:var(--mut);font-size:15px;margin:8px 0 0;white-space:pre-line}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;display:block;text-align:center;font:inherit;font-weight:600;font-size:16px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer}
.pri{background:var(--go);border-color:var(--go);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row b{font-weight:600}
.row small{color:var(--mut);white-space:nowrap}
.row a{color:var(--go);font-weight:600;text-decoration:none;white-space:nowrap}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.err{color:#C0392B;font-size:14px;margin:6px 0 0}
.note{font-size:13px;color:var(--mut);text-align:center;margin:16px 0 0}
.hide{display:none}
.warn{background:#FFF4D6;color:#6B4A00;border:1px solid #F0D58A;border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:15px}
.warn.off{background:#FCE8E6;color:#7A1F14;border-color:#F2B8B0}
@media(prefers-color-scheme:dark){.warn{background:#3A2E0A;color:#F5DFA0;border-color:#5A4712}.warn.off{background:#3D1612;color:#F7C1B8;border-color:#6B2A22}}
.spin{color:var(--mut);padding:24px 0;text-align:center}
</style>
</head>
<body>
<header>
  <h1>שאטלים שפיים</h1>
  <p>קווים 811 עד 815 · א׳–ה׳, 06:00 עד 22:45 · חינם</p>
</header>
<nav>
  <button id="tNear" class="on">התחנה הקרובה</button>
  <button id="tMeet">קבעי פגישה</button>
</nav>
<main>
  <div id="banner"></div>
  <section id="vNear">
    <div id="nearBox"><div class="spin">מאתרת את המיקום שלך…</div></div>
    <button class="btn" id="refresh">רענני מיקום</button>
    <div class="card" style="margin-top:12px">
      <p class="lbl" style="margin-bottom:6px">כל התחנות לפי קו</p>
      <select id="lineSel"></select>
      <div id="lineList" style="margin-top:6px"></div>
    </div>
  </section>

  <section id="vMeet" class="hide">
    <div class="card">
      <div id="savedBox"></div>
      <div id="recentBox"></div>
      <label for="addr" style="margin-top:0">כתובת הפגישה</label>
      <input id="addr" placeholder="ז'בוטינסקי 7, רמת גן" autocomplete="street-address">
      <button class="btn pri" id="findBtn" style="margin-top:10px">מצאי תחנה קרובה</button>
      <p class="err hide" id="addrErr"></p>
      <label for="stopSel">או בחרי תחנה ישירות</label>
      <select id="stopSel"><option value="">בחרי תחנה…</option></select>
    </div>
    <div id="meetStop"></div>
    <div class="card hide" id="saveCard">
      <p class="lbl" style="margin-bottom:6px">לשמור כמקום קבוע?</p>
      <div style="display:flex;gap:8px"><input id="saveName" placeholder="למשל: הלקוח ברמת החייל"><button class="btn" id="saveBtn" style="flex:none;width:auto;padding:0 16px">שמרי</button></div>
      <p class="lbl hide" id="saveMsg" style="margin-top:6px;color:var(--go)">נשמר ✓</p>
    </div>
    <div class="card hide" id="calCard">
      <label for="mTitle" style="margin-top:0">נושא</label>
      <input id="mTitle" placeholder="פגישה">
      <div class="two">
        <div><label for="mDate">תאריך</label><input id="mDate" type="date"></div>
        <div><label for="mTime">שעה</label><input id="mTime" type="time" value="10:00"></div>
      </div>
      <label for="mDur">משך</label>
      <select id="mDur"><option value="30">30 דקות</option><option value="60" selected>שעה</option><option value="90">שעה וחצי</option><option value="120">שעתיים</option></select>
      <p class="err hide" id="calErr"></p>
      <label for="mHome">זמן נסיעה ממך עד שפיים (דקות)</label>
      <input id="mHome" type="number" inputmode="numeric" min="0" max="120" value="25">
      <p class="meta" id="travelInfo"></p>
      <p class="warn hide" id="mWarn" style="margin-top:10px"></p>
      <a class="btn pri" id="calBtn" style="margin-top:12px" href="#" target="_blank" rel="noopener">צרי אירוע ביומן גוגל</a>
      <a class="btn" id="travBtn" style="margin-top:8px" href="#" target="_blank" rel="noopener">הוסיפי "נסיעה" ביומן</a>
    </div>
  </section>
  <p class="note">מקור התחנות: מאגר משרד התחבורה ואתר הנתיבים המהירים (20fl.co.il), נכון ל-25.11.2026. זמני ההליכה משוערים. · גרסה 7</p>
</main>

<script>
{
const LINES={
 '811':{n:'הקריה',c:'#5B4FC4'},
 '812':{n:'הבורסה',c:'#C2417A'},
 '813':{n:'בגין-המסגר',c:'#D0661F'},
 '814':{n:'יגאל אלון',c:'#2F8F3A'},
 '815':{n:'קריית עתידים',c:'#1F78B4'}
};
// scheduled minutes from Shefayim to each stop (MoT GTFS, 23.11.2026)
const RIDE={20876:14,28581:17,20313:18,25625:19,25722:21,21238:22,21815:23,20314:12,28567:13,3174:14,21197:15,26255:16,20801:18,20029:18,4237:19,21675:17,20725:18,20726:19,25141:20,27117:21,20753:22,21487:18,21518:20,21454:22,23023:24,26302:13,21562:14,21163:17,21827:20,21829:21,21831:21,21716:27};
// [code, name, lat, lon, line] — ordered by route
const STOPS=[
 [20876,'דרך נמיר/שדרות שאול המלך',32.078509,34.793016,'811'],
 [28581,'מתחם שרונה/אליעזר קפלן',32.073491,34.787018,'811'],
 [20313,'אליעזר קפלן/דובנוב',32.07356,34.783258,'811'],
 [25625,'לונדון מיניסטור/אבן גבירול',32.074469,34.781836,'811'],
 [25722,'האופרה/שד׳ שאול המלך',32.075623,34.784789,'811'],
 [21238,'בית המשפט/ויצמן',32.078868,34.788581,'811'],
 [21815,'בי״ח איכילוב/ויצמן',32.080816,34.788879,'811'],
 [20314,'רכבת סבידור מרכז/גשר מודעי',32.085026,34.798515,'812'],
 [28567,'דרך בגין/יצחק מודעי',32.08548,34.800364,'812'],
 [3174,'אהליאב/היצירה',32.087443,34.802415,'812'],
 [21197,'ביאליק/תובל',32.088275,34.80462,'812'],
 [26255,'דרך אבא הלל/ביאליק',32.086969,34.805391,'812'],
 [20801,'רק״ל אבא הלל/ז׳בוטינסקי',32.083007,34.802159,'812'],
 [20029,'זיסמן/דרך בגין',32.084093,34.800513,'812'],
 [4237,'יעקב דורי/דרך מנחם בגין',32.085081,34.799427,'812'],
 [21675,'קריית הממשלה/דרך מנחם בגין',32.072279,34.789606,'813'],
 [20725,'דרך מנחם בגין/החשמונאים',32.068718,34.786781,'813'],
 [20726,'דרך מנחם בגין/המלאכה',32.067185,34.784932,'813'],
 [25141,'דרך מנחם בגין/נחמני',32.064395,34.781449,'813'],
 [27117,'הרכבת/סלומון',32.062285,34.78004,'813'],
 [20753,'הרכבת/ראש פינה',32.059633,34.782976,'813'],
 [21487,'יגאל אלון/דרך השלום',32.071549,34.794118,'814'],
 [21518,'יגאל אלון/קרמניצקי',32.067602,34.792921,'814'],
 [21454,'יגאל אלון/הפלמ״ח',32.062878,34.792016,'814'],
 [23023,'לה גוארדיה/המעפילים',32.059392,34.788682,'814'],
 [26302,'רכבת האוניברסיטה/שד׳ רוקח',32.102783,34.80697,'815'],
 [21562,'לונה פארק/שד׳ רוקח',32.105513,34.81257,'815'],
 [21163,'מרכז הספורט/בכור שטרית',32.105868,34.820154,'815'],
 [21827,'ראול ולנברג/הברזל',32.107031,34.833789,'815'],
 [21829,'ראול ולנברג/הנחושת',32.1097,34.837166,'815'],
 [21831,'מטה מרחב ירקון/ראול ולנברג',32.108777,34.835807,'815'],
 [21716,'שד׳ רוקח/בכור שטרית',32.107454,34.814433,'815']
].map(s=>({code:s[0],name:s[1],lat:s[2],lon:s[3],line:s[4],ride:RIDE[s[0]]}));

const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dist=(a,b,c,d)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const walk=m=>Math.max(1,Math.ceil(m*1.25/80));
const fmtM=m=>m<1000?Math.round(m/10)*10+' מ׳':(m/1000).toFixed(1)+' ק״מ';
const pill=l=>`<span class="pill" style="background:${LINES[l].c}">${l} · ${LINES[l].n}</span>`;
const waze=s=>`https://waze.com/ul?ll=${s.lat},${s.lon}&navigate=yes`;
const gmaps=s=>`https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}&travelmode=walking`;
const nearest=(lat,lon)=>STOPS.map(s=>({...s,d:dist(lat,lon,s.lat,s.lon)})).sort((a,b)=>a.d-b.d);

/* tabs */
function tab(n){const near=n==='near';$('vNear').classList.toggle('hide',!near);$('vMeet').classList.toggle('hide',near);$('tNear').classList.toggle('on',near);$('tMeet').classList.toggle('on',!near);}
$('tNear').onclick=()=>tab('near');$('tMeet').onclick=()=>tab('meet');

/* nearest to me */
function showNear(lat,lon){
 const all=nearest(lat,lon),top=all[0],far=top.d>5000;
 const more=all.slice(1,5).map(s=>`<div class="row"><span><b>${esc(s.name)}</b><br><small>קו ${s.line} · ${walk(s.d)} דק׳ הליכה</small></span><a href="${gmaps(s)}" target="_blank" rel="noopener">ניווט</a></div>`).join('');
 $('nearBox').innerHTML=`<div class="card">
  ${far?`<p class="err">את רחוקה מהתחנות (${fmtM(top.d)}). זו התחנה הכי קרובה בכל זאת:</p>`:''}
  <p class="lbl">התחנה הקרובה אלייך</p>
  <p class="big">${esc(top.name)}</p>${pill(top.line)}
  <p class="meta">${far?fmtM(top.d):walk(top.d)+' דק׳ הליכה · '+fmtM(top.d)}</p>
  <div class="btns"><a class="btn pri" href="${waze(top)}" target="_blank" rel="noopener">נווטי בוויז</a><a class="btn" href="${gmaps(top)}" target="_blank" rel="noopener">Google Maps</a></div>
 </div><div class="card"><p class="lbl">עוד תחנות קרובות</p>${more}</div>`;
}
function locate(){
 $('nearBox').innerHTML='<div class="spin">מאתרת את המיקום שלך…</div>';
 if(!navigator.geolocation){$('nearBox').innerHTML='<div class="card"><p class="err">הדפדפן לא תומך באיתור מיקום. אפשר לבחור קו מהרשימה למטה.</p></div>';return}
 navigator.geolocation.getCurrentPosition(p=>showNear(p.coords.latitude,p.coords.longitude),
  e=>{$('nearBox').innerHTML=`<div class="card"><p class="err">${e.code===1?'אין הרשאת מיקום. באייפון: הגדרות ← פרטיות ← שירותי מיקום ← Safari ← "בזמן השימוש".':'לא הצלחתי לאתר מיקום. נסי שוב.'}</p></div>`},
  {enableHighAccuracy:true,timeout:12000,maximumAge:30000});
}
$('refresh').onclick=locate;

/* list by line */
$('lineSel').innerHTML=Object.keys(LINES).map(l=>`<option value="${l}">קו ${l} · ${LINES[l].n}</option>`).join('');
function showLine(){const l=$('lineSel').value;$('lineList').innerHTML=STOPS.filter(s=>s.line===l).map((s,i)=>`<div class="row"><span>${i+1}. ${esc(s.name)}</span><a href="${gmaps(s)}" target="_blank" rel="noopener">ניווט</a></div>`).join('')}
$('lineSel').onchange=showLine;showLine();

/* meeting */
let meet=null,meetAddr='',meetWalk=0;
$('stopSel').innerHTML+=Object.keys(LINES).map(l=>`<optgroup label="קו ${l} · ${LINES[l].n}">${STOPS.map((s,i)=>s.line===l?`<option value="${i}">${esc(s.name)}</option>`:'').join('')}</optgroup>`).join('');
/* saved + recent places (kept on this phone) */
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let editing=false;
const byCode=c=>STOPS.find(x=>x.code===c);
function renderPlaces(){
 const sv=LS.get('saved'),rc=LS.get('recent').filter(r=>!sv.some(x=>x.code===r.code&&x.addr===r.addr));
 $('savedBox').innerHTML=sv.length?`<p class="lbl">המקומות שלי <a href="#" id="editP" style="color:var(--mut);font-size:13px;margin-inline-start:6px">${editing?'סיום':'עריכה'}</a></p><div class="chips">${sv.map((x,i)=>`<button class="chip star" data-s="${i}">★ ${esc(x.name)}${editing?'<span class="x">×</span>':''}</button>`).join('')}</div>`:'';
 $('recentBox').innerHTML=rc.length?`<p class="lbl">אחרונים</p><div class="chips">${rc.slice(0,5).map((x,i)=>`<button class="chip" data-r="${i}">${esc(x.addr)}</button>`).join('')}</div>`:'';
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;if(editing){sv.splice(i,1);LS.set('saved',sv);renderPlaces();return}usePlace(sv[i],true)});
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>usePlace(rc[+b.dataset.r],false));
 const e=$('editP');if(e)e.onclick=ev=>{ev.preventDefault();editing=!editing;renderPlaces()};
}
function usePlace(x,isSaved){const st=byCode(x.code);if(!st)return;meetWalk=0;meetAddr=x.addr;$('addr').value=x.addr;pickStop(st,(isSaved?`★ ${x.name} · `:'')+x.addr,true)}
$('saveBtn').onclick=()=>{
 const n=$('saveName').value.trim()||meetAddr||meet.name;
 const sv=LS.get('saved').filter(x=>x.name!==n);sv.unshift({name:n,addr:meetAddr||meet.name,code:meet.code});LS.set('saved',sv.slice(0,12));
 $('saveMsg').classList.remove('hide');$('saveName').value='';renderPlaces();
};
function pickStop(s,extra,fromList){
 if(meet!==s&&!extra) meetWalk=0;
 meet=s;
 const addr=meetAddr||s.name;
 const rc=LS.get('recent').filter(r=>!(r.code===s.code&&r.addr===addr));rc.unshift({addr,code:s.code});LS.set('recent',rc.slice(0,5));
 renderPlaces();
 $('saveCard').classList.toggle('hide',!!fromList);$('saveMsg').classList.add('hide');
 $('meetStop').innerHTML=`<div class="card"><p class="lbl">${extra?'התחנה הכי קרובה לפגישה':'התחנה שבחרת'}</p><p class="big">${esc(s.name)}</p>${pill(s.line)}${extra?`<p class="meta">${esc(extra)}</p>`:''}<p class="meta">${s.ride} דק׳ בשאטל משפיים (לפי לוח הזמנים)</p></div>`;
 $('calCard').classList.remove('hide');
 if(!$('mTitle').value) $('mTitle').value='פגישה';
 buildCal();
}
$('stopSel').onchange=()=>{const v=$('stopSel').value;if(v==='')return;meetAddr='';meetWalk=0;pickStop(STOPS[+v]);};
$('addr').oninput=()=>$('addrErr').classList.add('hide');
/* address/place search: collect all matches in the TA area, let her choose */
const BOX='34.74,32.13,34.86,32.03';
const inArea=(la,lo)=>la>31.98&&la<32.16&&lo>34.70&&lo<34.90;
async function nomi(q,bounded){
 const u='https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=8&countrycodes=il&accept-language=he&q='+encodeURIComponent(q)+(bounded?'&viewbox='+BOX+'&bounded=1':'');
 const r=await fetch(u).then(r=>r.json());
 return r.filter(x=>inArea(+x.lat,+x.lon)).map(x=>{const a=x.address||{};
  return {lat:+x.lat,lon:+x.lon,name:x.name||(x.display_name||'').split(',')[0],
   street:a.road?(a.road+(a.house_number?' '+a.house_number:'')):'',
   area:a.neighbourhood||a.suburb||a.quarter||'',city:a.city||a.town||''}});
}
async function photon(q){
 const u='https://photon.komoot.io/api/?limit=8&lat=32.08&lon=34.79&q='+encodeURIComponent(q);
 const r=await fetch(u).then(r=>r.json());
 return (r.features||[]).filter(f=>inArea(f.geometry.coordinates[1],f.geometry.coordinates[0])).map(f=>{const p=f.properties;
  return {lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],name:p.name||'',
   street:p.street?(p.street+(p.housenumber?' '+p.housenumber:'')):'',area:p.district||p.locality||'',city:p.city||''}});
}
/* local knowledge: areas the shuttles serve, typo-tolerant */
const norm=t=>(' '+t+' ').toLowerCase().replace(/["'׳״`’]/g,'').replace(/[\/,.\-]/g,' ').replace(/יי/g,'י').replace(/וו/g,'ו').replace(/קרית/g,'קירית').replace(/\s+/g,' ');
const AREAS=[
 [['רמת החייל','רמת החיל'],[21827,21829,21831,21163]],
 [['קריית עתידים','עתידים'],[21829,21831]],
 [['הבורסה','בורסה','בורסת היהלומים'],[20801,26255,20029]],
 [['עזריאלי','קריית הממשלה','הקריה'],[21675]],
 [['שרונה'],[28581]],
 [['איכילוב','סוראסקי'],[21815]],
 [['בית המשפט'],[21238]],
 [['מוזיאון תל אביב','האופרה'],[25722]],
 [['סבידור','רכבת מרכז','מסוף 2000'],[20314]],
 [['אוניברסיטה','רכבת האוניברסיטה'],[26302]],
 [['לונה פארק','גני התערוכה','אקספו'],[21562]],
 [['מגדל אלקטרה','רכבת השלום'],[21487]]
].map(([names,codes])=>{const ss=STOPS.filter(x=>codes.includes(x.code));
 return {names,lat:ss.reduce((a,x)=>a+x.lat,0)/ss.length,lon:ss.reduce((a,x)=>a+x.lon,0)/ss.length}});
const STOPWORDS=['תל','אביב','רמת','גן','יפו','ליד','באזור','אזור','של'];
const lev=(a,b)=>{const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]};
const strip=w=>w.length>4&&'בלמוכש'.includes(w[0])?w.slice(1):w;
const core=w=>w.replace(/^ה/,'');
// find an area name inside the query: tolerant to prefixes (בבורסה), missing ה, one typo
function findArea(nq){
 const qw=nq.trim().split(' ');
 for(const a of AREAS)for(const n of a.names){
  const nw=norm(n).trim().split(' ');
  for(let i=0;i+nw.length<=qw.length;i++){
   const win=qw.slice(i,i+nw.length);
   const A=win.map(w=>core(strip(w))).join(' '),B=nw.map(core).join(' '),A2=win.map(core).join(' ');
   const tol=B.length>=6?1:0;
   if(lev(A,B)<=tol||lev(A2,B)<=tol) return {area:a,used:win};
  }
 }
 return null;
}
async function geocodeAll(q){
 const nq=norm(q);
 const f=findArea(nq),area=f&&f.area;
 // words left after removing the area name and generic words = the place itself
 const words=nq.trim().split(' ').filter(w=>!(f&&f.used.includes(w))).filter(w=>w.length>=3&&!STOPWORDS.includes(w));
 // stops whose street the query names directly (e.g. "ולנברג", "קפלן")
 const streetStops=STOPS.filter(x=>norm(x.name).split(' ').some(w=>w.length>=4&&words.includes(w)));
 let hits=[];
 if(words.length){
  const city=/תל.?אביב|רמת.?גן|גבעתיים|tel.?aviv|ramat/i.test(q);
  const qq=words.join(' ')+(area?' '+area.names[0]:'');
  const jobs=[nomi(qq,true),photon(city||area?qq:qq+' תל אביב')];
  hits=(await Promise.allSettled(jobs)).flatMap(r=>r.status==='fulfilled'?r.value:[]);
  // keep only results that actually match what she typed
  hits=hits.filter(h=>{const t=norm(h.name+' '+h.street);return words.some(w=>t.includes(w))});
  if(area) hits=hits.filter(h=>dist(h.lat,h.lon,area.lat,area.lon)<2500);
 }
 const out=[];
 for(const h of hits){if(!out.some(o=>dist(o.lat,o.lon,h.lat,h.lon)<250))out.push(h)}
 if(area) out.push({lat:area.lat,lon:area.lon,name:area.names[0],street:'',area:'האזור כולו',city:''});
 for(const x of streetStops) if(!out.some(o=>dist(o.lat,o.lon,x.lat,x.lon)<250)) out.push({lat:x.lat,lon:x.lon,name:x.name,street:'',area:'תחנה',city:''});
 return out.slice(0,6);
}
const label=h=>[h.name,h.street,h.area,h.city].filter((v,i,a)=>v&&a.indexOf(v)===i).join(' · ');
let cands=[];
function useHit(h,q){
 if(h.area==='האזור כולו'){
  const near=nearest(h.lat,h.lon).filter((x,i)=>i<2||x.d<500).slice(0,4);
  $('calCard').classList.add('hide');
  $('meetStop').innerHTML=`<div class="card"><p class="lbl">תחנות באזור ${esc(h.name)}. באיזו נוח לך?</p>${near.map((x,i)=>`<button class="btn pickS" data-i="${i}" style="margin-top:8px;text-align:start;font-weight:400"><b>${esc(x.name)}</b><br><small style="color:var(--mut)">קו ${x.line} · ${LINES[x.line].n}</small></button>`).join('')}</div>`;
  document.querySelectorAll('.pickS').forEach(b=>b.onclick=()=>{const x=near[+b.dataset.i];meetAddr=h.name;meetWalk=0;pickStop(x,`באזור ${h.name}`)});
  return;
 }
 const top=nearest(h.lat,h.lon)[0];
 meetWalk=walk(top.d);
 meetAddr=[h.name,h.street,h.area||h.city].filter(Boolean).join(', ')||q;
 pickStop(top,`המקום: ${label(h)}\n`+(top.d>3000?`התחנה הקרובה רחוקה מהמקום (${fmtM(top.d)})`:`${walk(top.d)} דק׳ הליכה · ${fmtM(top.d)}`));
}
async function findAddr(){
 const q=$('addr').value.trim(),err=$('addrErr');
 if(!q){err.textContent='הקלידי כתובת או מקום';err.classList.remove('hide');return}
 $('findBtn').textContent='מחפשת…';$('meetStop').innerHTML='';$('calCard').classList.add('hide');$('saveCard').classList.add('hide');
 try{
  cands=await geocodeAll(q);
  if(!cands.length){err.textContent='לא מצאתי. נסי להוסיף שכונה או רחוב (למשל "הפסאז\' רמת החייל"), או בחרי תחנה מהרשימה.';err.classList.remove('hide');return}
  if(cands.length===1){useHit(cands[0],q);return}
  $('meetStop').innerHTML=`<div class="card"><p class="lbl">מצאתי כמה מקומות. איזה מהם?</p>${cands.map((h,i)=>`<button class="btn pick" data-i="${i}" style="margin-top:8px;text-align:start;font-weight:400"><b>${esc(h.name||h.street)}</b><br><small style="color:var(--mut)">${esc([h.street!==h.name?h.street:'',h.area,h.city].filter(Boolean).join(' · '))}</small></button>`).join('')}</div>`;
  document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>useHit(cands[+b.dataset.i],q));
 }catch(e){err.textContent='אין חיבור לחיפוש כתובות כרגע. אפשר לבחור תחנה מהרשימה.';err.classList.remove('hide')}
 finally{$('findBtn').textContent='מצאי תחנה קרובה'}
}
$('findBtn').onclick=findAddr;
$('addr').onkeydown=e=>{if(e.key==='Enter')findAddr()};

const pad=n=>String(n).padStart(2,'0');
const today=new Date();$('mDate').value=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
function buildCal(){
 if(!meet)return;
 const d=$('mDate').value,t=$('mTime').value,err=$('calErr');
 if(!d||!t){err.textContent='בחרי תאריך ושעה';err.classList.remove('hide');$('calBtn').removeAttribute('href');return}
 err.classList.add('hide');
 const [Y,M,D]=d.split('-').map(Number),[h,m]=t.split(':').map(Number);
 const s=new Date(Y,M-1,D,h,m),e=new Date(s.getTime()+(+$('mDur').value)*60000);
 const f=x=>`${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
 const details=`ליד תחנת שאטל ${meet.line} (${LINES[meet.line].n}): ${meet.name}`+(meetAddr?`\nכתובת הפגישה: ${meetAddr}`:'')+`\nניווט לתחנה: ${gmaps(meet)}`;
 const loc=meetAddr||`${meet.name}, ${meet.lat},${meet.lon}`;
 // travel event, like Hila's own "נסיעה" blocks: ends when the meeting starts
 const peak=(x)=>{const mm=x.getHours()*60+x.getMinutes();return (mm>=390&&mm<600)||(mm>=870&&mm<1170)};
 const wait=peak(s)?5:15, home=Math.max(0,+$('mHome').value||0), ride=meet.ride||20, wk=meetWalk||0;
 const tot=home+wait+ride+wk, ts=new Date(s.getTime()-tot*60000);
 $('travelInfo').textContent=`נסיעה: ${home} עד שפיים + ${wait} המתנה + ${ride} בשאטל`+(wk?` + ${wk} הליכה`:'')+` = ${tot} דק׳. יציאה ב-${pad(ts.getHours())}:${pad(ts.getMinutes())}.`;
 const tdet=`שאטל ${meet.line} (${LINES[meet.line].n}) משפיים לתחנה ${meet.name}\n${$('travelInfo').textContent}\nניווט לתחנה: ${gmaps(meet)}`;
 $('travBtn').href='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('נסיעה')+'&dates='+f(ts)+'/'+f(s)+'&ctz=Asia/Jerusalem&details='+encodeURIComponent(tdet);
 const dw=s.getDay(),em=e.getHours()*60+e.getMinutes(),sm=ts.getHours()*60+ts.getMinutes();
 const w=[];
 if(dw===5||dw===6) w.push('השאטלים לא פועלים בשישי ובשבת.');
 else{ if(sm<SVC.start) w.push('היציאה לפני 06:00, השאטלים עוד לא פועלים.'); if(em>SVC.end-30) w.push('הפגישה נגמרת קרוב ל-22:45. בדקי שתספיקי לחזור לשפיים.'); }
 $('mWarn').textContent=w.join(' ');$('mWarn').classList.toggle('hide',!w.length);
 $('calBtn').href='https://calendar.google.com/calendar/render?action=TEMPLATE'
  +'&text='+encodeURIComponent($('mTitle').value||'פגישה')
  +'&dates='+f(s)+'/'+f(e)+'&ctz=Asia/Jerusalem'
  +'&location='+encodeURIComponent(loc)
  +'&details='+encodeURIComponent(details);
}
['mTitle','mDate','mTime','mDur'].forEach(id=>$(id).addEventListener('input',buildCal));

/* temporary changes from the official site (updated weekly) */
const NOTICES=[
 {line:'815',until:'2026-11-26',text:'קו 815: מ-21:30 עד סוף הפעילות, התחנות ראול ולנברג/הנחושת, ראול ולנברג/הברזל ומטה מרחב ירקון מבוטלות (עד 26.11).'}
];
const SVC={start:6*60,end:22*60+45};
function banner(){
 const now=new Date(),d=now.getDay(),m=now.getHours()*60+now.getMinutes(),today=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
 let h='';
 const act=NOTICES.filter(n=>n.until>=today);
 h+=act.map(n=>`<div class="warn">⚠ ${esc(n.text)}</div>`).join('');
 const work=d>=0&&d<=4;
 if(!work||m<SVC.start||m>=SVC.end) h+=`<div class="warn off">השאטלים לא פועלים עכשיו. שעות הפעילות: א׳–ה׳, 06:00 עד 22:45.</div>`;
 else if(SVC.end-m<=60) h+=`<div class="warn">שימי לב: השאטלים פועלים עד 22:45, עוד ${SVC.end-m} דק׳.</div>`;
 $('banner').innerHTML=h;
}
banner();setInterval(banner,60000);
try{const hm=localStorage.getItem('homeMin');if(hm)$('mHome').value=hm}catch(e){}
$('mHome').addEventListener('input',()=>{try{localStorage.setItem('homeMin',$('mHome').value)}catch(e){};buildCal()});
renderPlaces();
locate();
}
</script>
